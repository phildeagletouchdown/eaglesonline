<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>pretext / music</title>
    <link rel="stylesheet" href="styles.css">
     <style>
* {
  cursor: url('https://cdn.cursors-4u.net/previews/philadelphia-eagles-nfl-2aa14f13-32.webp') 32 32, auto !important;
}
    </style>
  </head>
  <body>
    <main
      class="stage music-stage"
      aria-label="Streaming links"
      data-backdrop="backdrop_1.mp4"
      data-backdrop-mobile="backdropmobile.mp4"
      data-backdrop-fallback="backdrop.png"
      data-backdrop-mobile-fallback="backdropmobile.png"
      data-node-layout="spreadsheet"
    >
      <pre class="ascii-layer" aria-hidden="true"></pre>
      <a class="back-link" href="index.html">index</a>

      <nav class="node-field" aria-label="Streaming links">
        <a
          class="node root"
          href="https://limewire.com/"
          data-node="limewire"
          data-label="limewire"
          data-row="01"
          aria-label="limewire"
          data-mobile-x="25"
          data-mobile-y="38"
          target="_blank"
          rel="noreferrer"
          style="--x: 50; --y: 28;"
        >
          <pre aria-hidden="true"></pre>
          <span class="node-label" aria-hidden="true">limewire</span>
        </a>

        <a
          class="node"
          href="https://archive.org/"
          data-node="internet-archive"
          data-label="internet archive"
          data-row="02"
          aria-label="internet archive"
          data-mobile-x="50"
          data-mobile-y="38"
          target="_blank"
          rel="noreferrer"
          style="--x: 68; --y: 39;"
        >
          <pre aria-hidden="true"></pre>
          <span class="node-label" aria-hidden="true">internet archive</span>
        </a>

        <a
          class="node"
          href="https://bandcamp.com/"
          data-node="bandcamp"
          data-label="bandcamp"
          data-row="03"
          aria-label="bandcamp"
          data-mobile-x="75"
          data-mobile-y="38"
          target="_blank"
          rel="noreferrer"
          style="--x: 50; --y: 50;"
        >
          <pre aria-hidden="true"></pre>
          <span class="node-label" aria-hidden="true">bandcamp</span>
        </a>

        <a
          class="node"
          href="https://music.youtube.com/"
          data-node="youtube"
          data-label="youtube music"
          data-row="04"
          aria-label="youtube music"
          data-mobile-x="38"
          data-mobile-y="62"
          target="_blank"
          rel="noreferrer"
          style="--x: 68; --y: 61;"
        >
          <pre aria-hidden="true"></pre>
          <span class="node-label" aria-hidden="true">youtube music</span>
        </a>

        <a
          class="node"
          href="https://soundcloud.com/"
          data-node="soundcloud"
          data-label="soundcloud"
          data-row="05"
          aria-label="soundcloud"
          data-mobile-x="62"
          data-mobile-y="62"
          target="_blank"
          rel="noreferrer"
          style="--x: 50; --y: 72;"
        >
          <pre aria-hidden="true"></pre>
          <span class="node-label" aria-hidden="true">soundcloud</span>
        </a>
      </nav>
    </main>

    <script src="pretext.js"></script>
    <script src="ascii-image.js"></script>
    <script src="site.js"></script>
  </body>
</html>
