<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>pretext / check email</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="download.css">
    <style>
* {
  cursor: url('https://cdn.cursors-4u.net/previews/philadelphia-eagles-nfl-2aa14f13-32.webp') 32 32, auto !important;
}
    </style>
  </head>
  <body>
    <main
      class="stage download-stage"
      aria-labelledby="thanks-title"
      data-backdrop="backdrop_dither.mp4"
      data-backdrop-mobile="backdrop_dither.mp4"
      data-node-layout="spreadsheet"
    >
      <pre class="ascii-layer" aria-hidden="true"></pre>
      <a class="back-link" href="index.html" data-home-link>HOME</a>

      <section class="node-field download-menu" aria-label="Download confirmation">
        <div class="sheet-row" data-row="01">
          <span class="node-label" id="thanks-title">link sent</span>
        </div>
        <div class="sheet-row" data-row="02">
          <span class="node-label">check your email</span>
        </div>
        <a class="sheet-row" href="music.html" data-doc-page="music" data-row="03">
          <span class="node-label">back to music</span>
        </a>
        <a class="sheet-row" href="index.html" data-home-link data-row="04">
          <span class="node-label">return home</span>
        </a>
      </section>
    </main>

    <script src="site-nav.js"></script>
    <script src="pretext.js"></script>
    <script src="ascii-image.js"></script>
    <script src="site.js"></script>
  </body>
</html>
