<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>pretext / contact</title>
    <link rel="stylesheet" href="styles.css">
     <style>
* {
  cursor: url('https://cdn.cursors-4u.net/previews/philadelphia-eagles-nfl-2aa14f13-32.webp') 32 32, auto !important;
}
    </style>
  </head>
  <body>
    <main class="page-shell contact-page">
      <a class="back-link" href="index.html">index</a>
      <h1>contact</h1>
      <form
        class="contact-form"
        data-contact-form
        action="https://formsubmit.co/phildeagletouchdown@gmail.com"
        method="POST"
      >
        <input type="hidden" name="_subject" value="New contact form submission">
        <input type="hidden" name="_template" value="table">
        <input type="text" name="_honey" tabindex="-1" autocomplete="off" hidden>
        <label>
          name
          <input name="name" autocomplete="name" required>
        </label>
        <label>
          email
          <input name="email" type="email" autocomplete="email" required>
        </label>
        <label>
          message
          <textarea name="message" rows="8" required></textarea>
        </label>
        <button type="submit">send</button>
        <p class="page-meta" data-contact-status></p>
      </form>
    </main>
    <script src="contact.js"></script>
  </body>
</html>
